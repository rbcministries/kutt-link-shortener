name: Deploy to Azure App Service

# Deploys Kutt as a Node.js app (no Docker) to the go.odbm.org Web App.
# Setup steps are in DEPLOYMENT.md.
#
# Repo secrets (Settings > Secrets and variables > Actions > Secrets):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
# Repo variables (same page > Variables):
#   AZURE_WEBAPP_NAME  name of the Web App, e.g. app-kutt-prod

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # sign in to Azure with OIDC, no stored password

concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # must match the Web App runtime (Node 22 LTS) so native modules load
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Package app
        run: zip -qr release.zip . -x ".git/*" ".github/*" "docs/*" "db/*" ".env"

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # the Web App's startup command runs migrations before starting:
      # npm run migrate && npm start
      - name: Deploy to Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: release.zip
